name: build pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-frontend:${{ github.sha }} \
            ./frontend

      - name: Build backend.api
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-backend-api:${{ github.sha }} \
            ./backend.api

      - name: Build backend.caja
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-backend-caja:${{ github.sha }} \
            ./backend.caja

      - name: Push images
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-frontend:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-backend-api:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sanjusto-caja-backend-caja:${{ github.sha }}